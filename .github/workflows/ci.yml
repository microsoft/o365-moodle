# Title of the workflow
name: Moodle Plugin CI for Microsoft plugins

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run this workflow every time a new commit pushed to your repository or PR created.
on:
  push:
    branches:
      - 'MOODLE_*_STABLE'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        folder: [ auth/oidc, blocks/microsoft, local/o365, local/office365, local/onenote, repository/office365, theme/boost_o365teams, mod/assign/feedback/onenote, mod/assign/submission/onenote, lib/editor/tiny/plugins/teamsmeeting ]
        moodle-branch: [ 'MOODLE_502_STABLE' ]
        php: [ 8.3, 8.4 ]
        database: [ pgsql, mariadb ]
        # Only folders whose plugin has in-tree dependencies need an entry here.
        # List every dependency, including transitive ones, as space-separated
        # folder paths (see each plugin's version.php $plugin->dependencies).
        include:
          - folder: blocks/microsoft
            internal-deps: "auth/oidc local/o365"
          - folder: local/o365
            internal-deps: "auth/oidc"
          - folder: local/office365
            internal-deps: "auth/oidc local/o365 blocks/microsoft repository/office365 theme/boost_o365teams"
          - folder: local/onenote
            internal-deps: "auth/oidc local/o365"
          - folder: repository/office365
            internal-deps: "auth/oidc local/o365"
          - folder: theme/boost_o365teams
            internal-deps: "auth/oidc local/o365"
          - folder: mod/assign/feedback/onenote
            internal-deps: "auth/oidc local/o365 local/onenote"
          - folder: mod/assign/submission/onenote
            internal-deps: "auth/oidc local/o365 local/onenote"

    steps:
      - name: Check out sub repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # matrix.internal-deps is space-separated and cannot be a single
          # sparse pattern, so check out every folder that is a dependency of
          # any plugin; the install step below moves the ones this job needs.
          sparse-checkout: |
            ${{ matrix.folder }}
            auth/oidc
            blocks/microsoft
            local/o365
            local/onenote
            repository/office365
            theme/boost_o365teams
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      # Install this project into a directory called "ci", updating PATH and
      # locale, define nvm location.
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # Run the default install.
      - name: Install moodle-plugin-ci
        run: |
          mkdir -p ./extra-plugins
          for dep in ${{ matrix.internal-deps }}; do
            if [ -d "./plugin/$dep" ]; then
              mv -v "./plugin/$dep" "./extra-plugins/${dep//\//_}"
            else
              echo "Dependency directory ./plugin/$dep does not exist" >&2
              exit 1
            fi
          done
          moodle-plugin-ci install --plugin ./plugin/${{ matrix.folder }} --db-host=127.0.0.1 --extra-plugins ./extra-plugins
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          SHELLOPTS: errexit:nounset:xtrace

      - name: PHP Lint
        if: ${{ !cancelled() }} # prevents CI run stopping if step failed.
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
